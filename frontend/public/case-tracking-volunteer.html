<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQGrid | Case Tracking</title>
    <style>
      :root {
        --bg: #08111f;
        --bg2: #101c33;
        --card: #14233d;
        --border: #24354f;
        --primary: #7c3aed;
        --primary2: #8b5cf6;
        --text: #ffffff;
        --muted: #a8b3c7;
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #facc15;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

        color: var(--text);

        background:
          radial-gradient(
            circle at top left,
            rgba(124, 58, 237, 0.2),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(37, 99, 235, 0.15),
            transparent 30%
          ),
          linear-gradient(135deg, #08111f, #0f172a, #101827);

        min-height: 100vh;

        overflow-x: hidden;
      }

      body::before {
        content: "";

        position: fixed;

        width: 450px;

        height: 450px;

        border-radius: 50%;

        background: #7c3aed;

        top: -180px;

        left: -180px;

        opacity: 0.15;

        filter: blur(120px);

        z-index: -2;
      }

      body::after {
        content: "";

        position: fixed;

        width: 380px;

        height: 380px;

        border-radius: 50%;

        background: #2563eb;

        bottom: -150px;

        right: -150px;

        opacity: 0.12;

        filter: blur(120px);

        z-index: -2;
      }

      .case-container {
        max-width: 1200px;

        margin: 40px auto;

        padding: 30px;
      }

      /* ================= HEADER ================= */

      .case-header {
        display: flex;

        align-items: center;

        gap: 30px;

        padding: 30px;

        border-radius: 24px;

        background: rgba(255, 255, 255, 0.06);

        backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.08);

        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);

        transition: 0.35s;
      }

      .case-header:hover {
        transform: translateY(-4px);

        box-shadow: 0 25px 60px rgba(124, 58, 237, 0.25);
      }

      .case-header img {
        width: 150px;

        height: 150px;

        border-radius: 22px;

        object-fit: cover;

        border: 4px solid rgba(124, 58, 237, 0.45);

        transition: 0.35s;
      }

      .case-header img:hover {
        transform: scale(1.05);

        box-shadow: 0 0 35px rgba(124, 58, 237, 0.55);
      }

      .case-info h1 {
        font-size: 38px;

        font-weight: 700;

        margin-bottom: 12px;

        letter-spacing: 0.5px;
      }

      .case-info p {
        color: var(--muted);

        margin: 8px 0;

        font-size: 15px;
      }

      /* ================= STATUS ================= */

      .status {
        display: inline-block;

        margin-top: 18px;

        padding: 10px 20px;

        border-radius: 40px;

        font-size: 13px;

        font-weight: 700;

        letter-spacing: 1px;

        text-transform: uppercase;

        box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
      }

      .status.active {
        color: #22c55e;

        background: rgba(34, 197, 94, 0.15);
      }

      .status.closed {
        color: #ef4444;

        background: rgba(239, 68, 68, 0.15);
      }

      .status.searching {
        color: #facc15;

        background: rgba(250, 204, 21, 0.15);
      }
      /* ==========================================
            REPORT GRID
========================================== */

      .report-grid {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 28px;

        margin-top: 30px;
      }

      /* ==========================================
            REPORT CARD
========================================== */

      .report-card {
        background: rgba(255, 255, 255, 0.05);

        backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 22px;

        padding: 28px;

        position: relative;

        overflow: hidden;

        transition: 0.35s;
      }

      .report-card:hover {
        transform: translateY(-8px);

        border-color: #7c3aed;

        box-shadow: 0 18px 45px rgba(124, 58, 237, 0.28);
      }

      /* Shine Effect */

      .report-card::before {
        content: "";

        position: absolute;

        top: 0;

        left: -120%;

        width: 80px;

        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );

        transform: skewX(-20deg);

        transition: 1s;
      }

      .report-card:hover::before {
        left: 140%;
      }

      .report-card h3 {
        font-size: 22px;

        margin-bottom: 25px;

        color: #fff;

        font-weight: 700;

        position: relative;
      }

      .report-card h3::after {
        content: "";

        position: absolute;

        left: 0;

        bottom: -10px;

        width: 70px;

        height: 3px;

        border-radius: 5px;

        background: linear-gradient(90deg, #7c3aed, #3b82f6);
      }

      /* ==========================================
            DETAILS
========================================== */

      .detail {
        display: flex;

        justify-content: space-between;

        align-items: center;

        padding: 16px 0;

        border-bottom: 1px solid rgba(255, 255, 255, 0.06);

        transition: 0.3s;
      }

      .detail:hover {
        padding-left: 10px;

        background: rgba(255, 255, 255, 0.03);

        border-radius: 10px;
      }

      .detail:last-child {
        border-bottom: none;
      }

      .detail label {
        color: #b8c1d4;

        font-size: 15px;

        font-weight: 500;
      }

      .detail span {
        color: #fff;

        font-weight: 700;

        text-align: right;

        font-size: 15px;
      }

      /* ==========================================
            DESCRIPTION
========================================== */

      .description {
        background: rgba(255, 255, 255, 0.04);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-left: 5px solid #7c3aed;

        border-radius: 18px;

        padding: 22px;

        color: #d7dce7;

        line-height: 1.9;

        font-size: 15px;
      }

      /* ==========================================
            PRIORITY
========================================== */

      .priority-high {
        color: #ef4444;

        font-weight: 700;
      }

      .priority-medium {
        color: #f59e0b;

        font-weight: 700;
      }

      .priority-low {
        color: #22c55e;

        font-weight: 700;
      }

      /* ==========================================
            AI BOX
========================================== */

      .ai-box {
        margin-top: 20px;

        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.12),
          rgba(59, 130, 246, 0.08)
        );

        border: 1px solid rgba(124, 58, 237, 0.3);

        border-left: 5px solid #7c3aed;

        border-radius: 18px;

        padding: 24px;

        position: relative;

        overflow: hidden;
      }

      .ai-box::after {
        content: "";

        position: absolute;

        width: 180px;

        height: 180px;

        background: rgba(124, 58, 237, 0.12);

        border-radius: 50%;

        top: -90px;

        right: -90px;
      }

      .ai-box h4 {
        color: #c4b5fd;

        margin-bottom: 12px;

        font-size: 18px;
      }

      .ai-box p {
        color: #e5e7eb;

        line-height: 1.8;

        font-size: 15px;
      }
      /* ==========================================
            ACTION BUTTONS
========================================== */

      .action-buttons {
        display: flex;

        gap: 20px;

        margin-top: 35px;
      }

      .action-buttons button {
        flex: 1;

        padding: 16px 24px;

        border: none;

        border-radius: 16px;

        cursor: pointer;

        font-size: 16px;

        font-weight: 600;

        transition: all 0.35s ease;

        position: relative;

        overflow: hidden;

        letter-spacing: 0.4px;
      }

      .action-buttons button::before {
        content: "";

        position: absolute;

        width: 0;

        height: 0;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.18);

        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

        transition: 0.5s;
      }

      .action-buttons button:hover::before {
        width: 350px;

        height: 350px;
      }

      .action-buttons button:hover {
        transform: translateY(-4px);
      }

      .primary-btn {
        background: linear-gradient(135deg, #7c3aed, #5b21b6);

        color: #fff;

        box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
      }

      .primary-btn:hover {
        box-shadow: 0 15px 35px rgba(124, 58, 237, 0.5);
      }

      .secondary-btn {
        background: #18253d;

        border: 1px solid rgba(255, 255, 255, 0.08);

        color: #fff;
      }

      .secondary-btn:hover {
        background: #22304d;
      }

      .danger-btn {
        background: linear-gradient(135deg, #ef4444, #dc2626);

        color: white;
      }

      .danger-btn:hover {
        box-shadow: 0 15px 35px rgba(239, 68, 68, 0.35);
      }

      /* ==========================================
            TIMELINE
========================================== */

      .timeline {
        margin-top: 35px;

        padding: 30px;

        border-radius: 22px;

        background: rgba(255, 255, 255, 0.05);

        backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .timeline h3 {
        font-size: 24px;

        margin-bottom: 30px;
      }

      .timeline-item {
        display: flex;

        gap: 20px;

        position: relative;

        padding-bottom: 28px;
      }

      .timeline-item:last-child {
        padding-bottom: 0;
      }

      .timeline-item:not(:last-child)::after {
        content: "";

        position: absolute;

        left: 6px;

        top: 18px;

        width: 2px;

        height: calc(100% - 8px);

        background: rgba(124, 58, 237, 0.35);
      }

      .timeline-dot {
        width: 15px;

        height: 15px;

        border-radius: 50%;

        background: #7c3aed;

        flex-shrink: 0;

        margin-top: 5px;

        box-shadow: 0 0 18px rgba(124, 58, 237, 0.6);
      }

      .timeline-content {
        background: rgba(255, 255, 255, 0.03);

        padding: 18px;

        border-radius: 14px;

        width: 100%;

        transition: 0.3s;
      }

      .timeline-content:hover {
        background: rgba(255, 255, 255, 0.06);

        transform: translateX(8px);
      }

      .timeline-content h4 {
        margin-bottom: 8px;

        font-size: 17px;
      }

      .timeline-content p {
        color: #b8c1d4;

        line-height: 1.7;
      }

      /* ==========================================
            SCROLLBAR
========================================== */

      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: #0f172a;
      }

      ::-webkit-scrollbar-thumb {
        background: #7c3aed;

        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6;
      }

      /* ==========================================
            SELECTION
========================================== */

      ::selection {
        background: #7c3aed;

        color: white;
      }

      /* ==========================================
            ANIMATIONS
========================================== */

      .case-header {
        animation: fadeTop 0.8s ease;
      }

      .report-card {
        animation: fadeUp 0.8s ease;
      }

      .timeline {
        animation: fadeUp 1s ease;
      }

      @keyframes fadeTop {
        from {
          opacity: 0;

          transform: translateY(-30px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;

          transform: translateY(35px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }
      /* ==========================================
            RESPONSIVE DESIGN
========================================== */

      @media (max-width: 1100px) {
        .case-container {
          padding: 25px;
        }

        .case-header {
          flex-direction: column;

          text-align: center;
        }

        .case-info {
          width: 100%;
        }

        .report-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        .case-container {
          padding: 18px;

          margin: 20px auto;
        }

        .case-header {
          padding: 22px;

          border-radius: 18px;
        }

        .case-header img {
          width: 120px;

          height: 120px;
        }

        .case-info h1 {
          font-size: 28px;
        }

        .report-card {
          padding: 22px;
        }

        .report-card h3 {
          font-size: 20px;
        }

        .detail {
          flex-direction: column;

          align-items: flex-start;

          gap: 8px;
        }

        .detail span {
          text-align: left;
        }

        .action-buttons {
          flex-direction: column;
        }

        .action-buttons button {
          width: 100%;
        }

        .timeline {
          padding: 22px;
        }

        .timeline-item {
          gap: 15px;
        }
      }

      @media (max-width: 480px) {
        .case-container {
          padding: 12px;
        }

        .case-header {
          padding: 18px;
        }

        .case-header img {
          width: 95px;

          height: 95px;
        }

        .case-info h1 {
          font-size: 24px;
        }

        .status {
          font-size: 11px;

          padding: 8px 15px;
        }

        .report-card {
          padding: 18px;
        }

        .report-card h3 {
          font-size: 18px;
        }

        .description {
          font-size: 14px;

          line-height: 1.7;
        }

        .ai-box {
          padding: 18px;
        }

        .action-buttons button {
          padding: 14px;

          font-size: 15px;
        }
      }

      /* ==========================================
            EXTRA POLISH
========================================== */

      .case-header,
      .report-card,
      .timeline {
        transition: all 0.35s ease;
      }

      .case-header:hover,
      .timeline:hover {
        border-color: #7c3aed;
      }

      .detail label {
        font-weight: 500;

        letter-spacing: 0.3px;
      }

      .detail span {
        font-weight: 700;
      }

      .description {
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
      }

      .ai-box {
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
      }

      .primary-btn {
        background-size: 200% 200%;

        animation: gradientMove 5s ease infinite;
      }

      @keyframes gradientMove {
        0% {
          background-position: left;
        }

        50% {
          background-position: right;
        }

        100% {
          background-position: left;
        }
      }

      /* ==========================================
            IMAGE ANIMATION
========================================== */

      .case-header img {
        animation: floatImage 4s ease-in-out infinite;
      }

      @keyframes floatImage {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }

        100% {
          transform: translateY(0);
        }
      }

      /* ==========================================
            CARD TITLE EFFECT
========================================== */

      .report-card h3 {
        transition: 0.3s;
      }

      .report-card:hover h3 {
        color: #c4b5fd;
      }

      /* ==========================================
            AI BOX GLOW
========================================== */

      .ai-box:hover {
        border-color: #8b5cf6;

        box-shadow: 0 0 25px rgba(124, 58, 237, 0.3);
      }

      /* ==========================================
            FOOTER SPACE
========================================== */

      .case-container {
        padding-bottom: 60px;
      }
    </style>
  </head>
  <body>
    <div class="case-container">
      <div class="case-header">
        <img id="photo" />

        <div class="case-info">
          <h1 id="name"></h1>

          <span id="status" class="status"></span>
        </div>
      </div>

      <div class="report-grid">
        <div class="report-card">
          <h3>Personal Details</h3>

          <div class="detail">
            <label>Age</label>
            <span id="age"></span>
          </div>

          <div class="detail">
            <label>Gender</label>
            <span id="gender"></span>
          </div>

          <div class="detail">
            <label>Height</label>
            <span id="height"></span>
          </div>

          <div class="detail">
            <label>Clothing</label>
            <span id="clothing"></span>
          </div>

          <div class="detail">
            <label>Medical Condition</label>
            <span id="medical"></span>
          </div>
        </div>

        <div class="report-card">
          <h3>Case Details</h3>

          <div class="detail">
            <label>Last Seen</label>
            <span id="lastSeen"></span>
          </div>

          <div class="detail">
            <label>Date & Time</label>
            <span id="dateTime"></span>
          </div>

          <div class="detail">
            <label>Priority</label>
            <span id="priority"></span>
          </div>

          <div class="detail">
            <label>Guardian Contact</label>
            <span id="guardian"></span>
          </div>
        </div>
      </div>

      <div class="report-card" style="margin-top: 25px">
        <h3>Description</h3>

        <div class="description" id="description"></div>
      </div>
      <div class="report-card">
        <h3>AI Priority Analysis</h3>

        <div class="ai-box">
          <p id="priorityReason"></p>
        </div>
      </div>
      <div class="action-buttons">
        <button id="mapBtn" class="primary-btn">Join Case</button>
        <button class="primary-btn" id="SightingBtn" data-id="">
          Report Sighting
        </button>
      </div>
    </div>
    <script src="https://resqgrid-b1zt.onrender.com/socket.io/socket.io.js"></script>
    <script src="./js/map/route-map.js"></script>
    <script src="/js/maps/hazard-map.js"></script>
    <script src="/js/map.js"></script>
    <script>
      const API = "https://resqgrid-b1zt.onrender.com";

      // ================= SOCKET =================

      const socket = io(API, {
        withCredentials: true,
      });

      // ================= URL PARAMS =================

      const params = new URLSearchParams(window.location.search);

      const caseId = params.get("id");

      // ================= CONNECT =================

      socket.on("connect", () => {
        console.log("Volunteer Connected:", socket.id);

        socket.emit("join_volunteers");

        joinCaseRoom();
      });

      // ================= JOIN CASE ROOM =================

      function joinCaseRoom() {
        if (!caseId) {
          console.log("No Case ID");

          return;
        }

        socket.emit("join_case", caseId);

        console.log("Joined Case Room:", caseId);
      }

      // ================= LOAD AFTER DOM =================

      document.addEventListener("DOMContentLoaded", () => {
        loadCase();
      });

      // ================= LIVE CASE UPDATE =================

      socket.on(
        "case_updated",

        (updatedCase) => {
          console.log("Case Updated:", updatedCase);

          if (updatedCase._id === caseId) {
            displayCase(updatedCase);
          }
        },
      );

      // ================= LIVE LOCATION =================

      socket.on(
        "volunteer_location",

        (data) => {
          console.log("Volunteer Location:", data);
        },
      );

      // ================= FETCH CASE =================

      async function loadCase() {
        try {
          if (!caseId) {
            console.error("No Case ID");

            return;
          }

          const res = await fetch(
            `${API}/volunteer/application/${caseId}`,

            {
              credentials: "include",
            },
          );

          const data = await res.json();

          if (!data.success) {
            alert(data.message || "Case not found");

            return;
          }

          console.log("CASE DATA:", data.application);

          displayCase(data.application);
        } catch (err) {
          console.error("Load Case Error:", err);
        }
      }

      // ================= DISPLAY CASE =================

      function displayCase(app) {
        console.log("Displaying Case:", app);

        // IMAGE

        const photo = document.getElementById("photo");

        if (photo) {
          photo.src = app.Photo
            ? `${API}/uploads/${app.Photo}`
            : "./images/default-user.png";
        }

        // TEXT DATA

        setText("name", app.Name);

        setText("status", app.status);

        setText("age", app.Age);

        setText("gender", app.Gender);

        setText("height", app.Height);

        setText("clothing", app.Clothing);

        setText("medical", app.MedicalConditions || "None");

        setText("lastSeen", app.LastSeen || "Not Available");

        setText("dateTime", app.dateTime || "Not Available");

        setText("priority", app.priorityLevel || "Pending");

        setText(
          "priorityReason",

          app.priorityReason || "No AI analysis available",
        );

        setText(
          "guardian",

          app.GuardianContact || "Not Available",
        );

        setText(
          "description",

          app.Description || "No Description",
        );

        // ================= BUTTON DATA =================

        const mapBtn = document.getElementById("mapBtn");

        if (mapBtn) {
          mapBtn.dataset.id = app._id;

          mapBtn.dataset.location = app.LastSeen || "";

          mapBtn.dataset.caseType = app.caseType || "";
        }

        const sightBtn = document.getElementById("SightingBtn");

        if (sightBtn) {
          sightBtn.dataset.id = app._id;
        }
      }

      // ================= HELPER =================

      function setText(id, value) {
        const el = document.getElementById(id);

        if (el) {
          el.innerText = value ?? "";
        }
      }

      // ================= MAP BUTTON =================

      document.addEventListener(
        "click",

        (e) => {
          const btn = e.target.closest("#mapBtn");

          if (!btn) {
            return;
          }

          const id = btn.dataset.id;

          const location = btn.dataset.location || "";

          const caseType = btn.dataset.caseType;

          if (!id) {
            console.log("Missing ID");

            return;
          }

          if (!caseType) {
            console.log("Missing Case Type");

            return;
          }

          window.location.href = `/map.html?id=${id}&location=${encodeURIComponent(location)}&caseType=${caseType}`;
        },
      );

      // ================= SIGHTING BUTTON =================

      document.addEventListener(
        "click",

        (e) => {
          const btn = e.target.closest("#SightingBtn");

          if (!btn) {
            return;
          }

          const id = btn.dataset.id;

          window.location.href = `/sighting-report.html?id=${id}&caseId=${caseId}`;
        },
      );

      // ================= CLEANUP =================

      window.addEventListener(
        "beforeunload",

        () => {
          socket.emit("leave_case", caseId);
        },
      );
    </script>
  </body>
</html>
