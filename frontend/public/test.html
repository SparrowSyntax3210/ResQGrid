<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ResQGrid SOS Test</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        text-align: center;
      }

      button {
        padding: 14px 24px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
      }

      #sosBtn {
        background: red;
        color: white;
      }

      #stopSosBtn {
        background: #222;
        color: white;
      }

      #submitSosBtn {
        background: green;
        color: white;
      }

      #status {
        margin-top: 25px;
        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <h1>🚨 ResQGrid SOS Test</h1>

    <button id="sosBtn">🚨 Start SOS Recording</button>

    <button id="stopSosBtn">⏹ Stop Recording</button>

    <button id="submitSosBtn">📡 Send SOS</button>

    <p id="status">Ready</p>

    <script src="./js/sos.service.js"></script>

    <script>
      const sosBtn = document.getElementById("sosBtn");

      const stopSosBtn = document.getElementById("stopSosBtn");

      const submitSosBtn = document.getElementById("submitSosBtn");

      const status = document.getElementById("status");

      // ======================================================
      // START RECORDING
      // ======================================================

      sosBtn.addEventListener("click", async () => {
        try {
          await startSOSRecording();

          status.textContent = "🎙️ Recording your emergency...";
        } catch (error) {
          console.error(error);

          status.textContent = "❌ Could not start recording.";
        }
      });

      // ======================================================
      // STOP RECORDING
      // ======================================================

      stopSosBtn.addEventListener("click", () => {
        try {
          stopSOSRecording();

          status.textContent = "✅ Recording stopped. Ready to send.";
        } catch (error) {
          console.error(error);

          status.textContent = "❌ Could not stop recording.";
        }
      });

      // ======================================================
      // SUBMIT SOS
      // ======================================================

      submitSosBtn.addEventListener("click", submitSOS);

      // ======================================================
      // SUBMIT SOS FUNCTION
      // ======================================================

      async function submitSOS() {
        // audioBlob should come from sos.service.js

        if (!audioBlob) {
          alert("Please record your emergency first.");

          return;
        }

        status.textContent = "📍 Getting your location...";

        // ==================================================
        // GET LOCATION
        // ==================================================

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const latitude = position.coords.latitude;

            const longitude = position.coords.longitude;

            console.log("📍 Location:", latitude, longitude);

            status.textContent = "📡 Sending SOS to ResQGrid...";

            // ==================================================
            // FORM DATA
            // ==================================================

            const formData = new FormData();

            formData.append("audio", audioBlob, "sos-recording.webm");

            formData.append("latitude", latitude);

            formData.append("longitude", longitude);

            // ==================================================
            // SEND TO BACKEND
            // ==================================================

            try {
              const response = await fetch(
                "/api/sos/analyze",
                {
                  method: "POST",
                  body: formData,
                },
              );

              const result = await response.json();

              console.log("🚨 RESQGRID SOS RESULT:", result);

              if (!response.ok) {
                throw new Error(result.message || "SOS submission failed.");
              }

              // ==================================================
              // SUCCESS
              // ==================================================

              status.textContent = `🚨 SOS CREATED — ${result.data?.priority || "PROCESSING"}`;

              console.log("Emergency Type:", result.analysis?.emergencyType);

              console.log("Priority:", result.analysis?.priority);

              console.log("Priority Score:", result.analysis?.priorityScore);

              console.log("Transcript:", result.analysis?.transcript);
            } catch (error) {
              console.error("❌ SOS submission failed:", error);

              status.textContent = "❌ Failed to send SOS.";
            }
          },

          // ==================================================
          // LOCATION ERROR
          // ==================================================

          (error) => {
            console.error("Location error:", error);

            status.textContent = "❌ Location permission is required.";

            alert("Please allow location access to send an SOS.");
          },

          {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0,
          },
        );
      }
    </script>
  </body>
</html>
