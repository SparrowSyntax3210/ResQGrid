<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ResQGrid | Map</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet Routing CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
    />

    <style>
      /* ==========================
   MAP
========================== */

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #map {
        width: 100%;
        height: 100vh;
      }

      /* Leaflet dark styling */

      .leaflet-container {
        background: #111;
        color: white;
      }

      .leaflet-popup-content-wrapper {
        background: #000;
        color: white;
      }

      .leaflet-popup-tip {
        background: #000;
      }

      .leaflet-popup-content {
        color: white;
      }

      /* Zoom buttons */

      .leaflet-control-zoom a {
        background: #000 !important;
        color: white !important;
        border-color: #555 !important;
      }

      /* ==========================
CHAT BUTTON
========================== */

      #chatToggle {
        position: absolute;

        bottom: 30px;

        right: 30px;

        z-index: 2000;

        padding: 14px 24px;

        border: none;

        border-radius: 14px;

        background: #7c3aed;

        color: white;

        font-size: 16px;

        cursor: pointer;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }

      .chat-badge {
        position: absolute;

        top: -6px;

        right: -6px;

        width: 22px;

        height: 22px;

        border-radius: 50%;

        background: #ff3b30;

        color: white;

        display: none;

        align-items: center;

        justify-content: center;

        font-size: 12px;
      }

      /* ==========================
CHAT OVERLAY
========================== */

      #chatOverlay {
        position: absolute;

        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

        width: 600px;

        height: 600px;

        background: white;

        border-radius: 18px;

        overflow: hidden;

        display: none;

        z-index: 3000;
      }

      .chat-header {
        height: 55px;

        background: #7c3aed;

        color: white;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 18px;
      }

      .chat-header button {
        border: none;

        background: none;

        color: white;

        font-size: 22px;

        cursor: pointer;
      }

      #chatFrame {
        width: 100%;

        height: 545px;

        border: none;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <button id="chatToggle">
      💬 Chat

      <span id="chatBadge" class="chat-badge"> 0 </span>
    </button>

    <div id="chatOverlay">
      <div class="chat-header">
        <h3>Case Chat</h3>

        <button id="closeChat">✕</button>
      </div>

      <iframe id="chatFrame" src=""> </iframe>
    </div>

    <!-- Socket.IO -->

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <!-- Leaflet -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing -->

    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <!-- GSAP -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/ScrollTrigger.min.js"></script>

    <!-- Map Modules -->

    <script src="./js/map/missing-person.js"></script>

    <script src="./js/map/route-map.js"></script>

    <script src="./js/map/escort-map.js"></script>

    <script src="./js/map/hazard-map.js"></script>

    <!-- Chat only once -->

    <script src="./js/map/chat.js"></script>

    <script src="./js/map/map.js"></script>
  </body>
</html>
