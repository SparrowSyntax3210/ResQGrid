<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQGrid | Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      #map {
        height: 100vh;
        width: 100%;
      }

      .grid-label {
        background: transparent;
        border: none;
        box-shadow: none;
        font-weight: bold;
        font-size: 16px;
        color: black;
      }
      #chatToggle {
        position: absolute;

        bottom: 30px;

        right: 30px;

        z-index: 1000;

        padding: 14px 24px;

        border: none;

        border-radius: 14px;

        background: #7c3aed;

        color: white;

        font-size: 16px;

        cursor: pointer;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }

      #chatOverlay {
        position: absolute;

        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

        width: 600px;

        height: 600px;

        background: white;

        border-radius: 18px;

        overflow: hidden;

        display: none;

        z-index: 9999;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .chat-header {
        height: 55px;

        background: #7c3aed;

        color: white;

        display: flex;

        justify-content: space-between;

        align-items: center;

        padding: 0 18px;
      }

      .chat-header button {
        border: none;

        background: none;

        color: white;

        font-size: 22px;

        cursor: pointer;
      }

      #chatFrame {
        width: 100%;

        height: 545px;
      }

      #chatToggle {
        position: relative;
      }

      .chat-badge {
        position: absolute;
        top: -6px;
        right: -6px;

        width: 22px;
        height: 22px;

        border-radius: 50%;

        background: #ff3b30;
        color: white;

        display: none;

        justify-content: center;
        align-items: center;

        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <button id="chatToggle">
      💬 Chat
      <span id="chatBadge" class="chat-badge">0</span>
    </button>

    <div id="chatOverlay">
      <div class="chat-header">
        <button id="closeChat">✕</button>
      </div>

      <iframe id="chatFrame" src="" frameborder="0"> </iframe>
    </div>

    <link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>

<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script src="/socket.io/socket.io.js"></script>

<script src="/js/map/missing-person.js"></script>
<script src="/js/map/route-map.js"></script>
<script src="/js/map/escort-map.js"></script>
<script src="/js/map/hazard-map.js"></script>
<script src="/js/map/chat.js"></script>
<script src="/js/map/map.js"></script>
  </body>
</html>
