<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQGrid | Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      /* ============================= */
/* DARK MAP THEME */
/* WHITE TEXT */
/* ============================= */

/* ============================= */
/* MAP DARK THEME FIX */
/* ============================= */

#map {

    width:100%;
    height:600px;
    background:#000;

}


/* Do NOT hide leaflet tiles */

.leaflet-container {

    color:white !important;

}


/* Popup styling */

.leaflet-popup-content-wrapper {

    background:#000;
    color:white;

}


.leaflet-popup-tip {

    background:#000;

}


.leaflet-popup-content {

    color:white;

}


.leaflet-popup-content h1,
.leaflet-popup-content h2,
.leaflet-popup-content h3,
.leaflet-popup-content p,
.leaflet-popup-content span {

    color:white !important;

}


/* Zoom buttons */

.leaflet-control-zoom a {

    background:#000 !important;
    color:white !important;
    border-color:#555 !important;

}

/* Any custom labels on map */

.map-label,
.marker-label,
.grid-label {

    color: #fff !important;
    background: #000 !important;

}


/* Dropdowns */

select {

    background:#000 !important;
    color:#fff !important;
    border:1px solid #555;

}


option {

    background:#000 !important;
    color:#fff !important;

}

      .grid-label {
        background: transparent;
        border: none;
        box-shadow: none;
        font-weight: bold;
        font-size: 16px;
        color: black;
      }
      #chatToggle {
        position: absolute;

        bottom: 30px;

        right: 30px;

        z-index: 1000;

        padding: 14px 24px;

        border: none;

        border-radius: 14px;

        background: #7c3aed;

        color: white;

        font-size: 16px;

        cursor: pointer;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }

      #chatOverlay {
        position: absolute;

        top: 50%;

        left: 50%;

        transform: translate(-50%, -50%);

        width: 600px;

        height: 600px;

        background: white;

        border-radius: 18px;

        overflow: hidden;

        display: none;

        z-index: 9999;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .chat-header {
        height: 55px;

        background: #7c3aed;

        color: white;

        display: flex;

        justify-content: space-between;

        align-items: center;

        padding: 0 18px;
      }

      .chat-header button {
        border: none;

        background: none;

        color: white;

        font-size: 22px;

        cursor: pointer;
      }

      #chatFrame {
        width: 100%;

        height: 545px;
      }

      #chatToggle {
        position: relative;
      }

      .chat-badge {
        position: absolute;
        top: -6px;
        right: -6px;

        width: 22px;
        height: 22px;

        border-radius: 50%;

        background: #ff3b30;
        color: white;

        display: none;

        justify-content: center;
        align-items: center;

        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <button id="chatToggle">
    💬 Chat
    <span id="chatBadge" class="chat-badge">0</span>
</button>


<div id="chatOverlay">

    <div class="chat-header">

        <h3>Case Chat</h3>

        <button id="closeChat">
            ✕
        </button>

    </div>


    <iframe 
        id="chatFrame"
        src=""
        frameborder="0">
    </iframe>


</div>
    </div>
    <!-- Socket -->
<script src="http://localhost:5000/socket.io/socket.io.js"></script>


<!-- Leaflet FIRST -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- Leaflet Routing Machine AFTER Leaflet -->
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>


<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/ScrollTrigger.min.js"></script>
<script src="./js/map/chat.js"></script>

<script src="/js/map/missing-person.js"></script>
<script src="/js/map/route-map.js"></script>
<script src="/js/map/escort-map.js"></script>
<script src="/js/map/hazard-map.js"></script>
<script src="/js/map/chat.js"></script>
<script src="/js/map/map.js"></script>
  </body>
</html>
